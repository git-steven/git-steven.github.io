<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="644" viewBox="0 0 1200 644" font-family="'Trebuchet MS','Segoe UI',sans-serif">
  <defs>
    <!-- Parchment background -->
    <linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="644">
      <stop offset="0" stop-color="#efe7d2"/>
      <stop offset="1" stop-color="#e2d6ba"/>
    </linearGradient>

    <!-- Lake: clean blue, west-to-radial feel -->
    <radialGradient id="lake" cx="34%" cy="42%" r="70%">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="0.55" stop-color="#3fb0e8"/>
      <stop offset="1" stop-color="#1f7fc0"/>
    </radialGradient>

    <!-- Swamp: murky green -->
    <radialGradient id="swamp" cx="66%" cy="52%" r="75%">
      <stop offset="0" stop-color="#b7c07a"/>
      <stop offset="0.6" stop-color="#8f9a52"/>
      <stop offset="1" stop-color="#5f6a33"/>
    </radialGradient>

    <!-- The transition band lake->swamp -->
    <linearGradient id="transition" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f7fc0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4a7f6a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5f6a33" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#d9cfb2"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- gentle water ripples -->
    <filter id="ripple"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/></filter>
    <!-- swamp murk -->
    <filter id="murk"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="3" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="644" fill="url(#paper)"/>
  <rect width="1200" height="644" fill="#000" opacity="0.015"/>

  <!-- ===================== LAKE (left) ===================== -->
  <g filter="url(#soft)">
    <ellipse cx="330" cy="322" rx="330" ry="250" fill="url(#lake)" filter="url(#ripple)"/>
  </g>
  <!-- metadata "shape" lines -->
  <g stroke="#ffd9a8" stroke-linecap="round" opacity="0.9">
    <line x1="150" y1="150" x2="520" y2="140" stroke-width="6"/>
    <line x1="150" y1="178" x2="500" y2="170" stroke-width="4"/>
  </g>
  <!-- organized versioned artifacts -->
  <g font-size="19" fill="#2c3e50">
    <g filter="url(#soft)">
      <rect x="150" y="250" rx="9" width="150" height="42" fill="url(#tile)"/>
      <rect x="150" y="316" rx="9" width="150" height="42" fill="url(#tile)"/>
      <rect x="150" y="382" rx="9" width="150" height="42" fill="url(#tile)"/>
    </g>
    <text x="225" y="277" text-anchor="middle">orders/v12</text>
    <text x="225" y="343" text-anchor="middle">users/v7</text>
    <text x="225" y="409" text-anchor="middle">events/v31</text>
  </g>
  <!-- neat grids of tiles -->
  <g fill="url(#tile)" filter="url(#soft)">
    <g id="cell"><rect rx="3" width="26" height="18"/></g>
    <!-- grid 1 -->
    <g transform="translate(360,252)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="34" y="0"/><use href="#cell" x="68" y="0"/>
      <use href="#cell" x="0" y="26"/><use href="#cell" x="34" y="26"/><use href="#cell" x="68" y="26"/>
      <use href="#cell" x="0" y="52"/><use href="#cell" x="34" y="52"/><use href="#cell" x="68" y="52"/>
    </g>
    <!-- grid 2 -->
    <g transform="translate(360,330)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="34" y="0"/><use href="#cell" x="68" y="0"/>
      <use href="#cell" x="0" y="26"/><use href="#cell" x="34" y="26"/><use href="#cell" x="68" y="26"/>
    </g>
    <!-- grid 3 -->
    <g transform="translate(360,392)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="34" y="0"/><use href="#cell" x="68" y="0"/>
      <use href="#cell" x="0" y="26"/><use href="#cell" x="34" y="26"/><use href="#cell" x="68" y="26"/>
    </g>
  </g>

  <!-- ===================== SWAMP (right) ===================== -->
  <g filter="url(#soft)">
    <path filter="url(#murk)" fill="url(#swamp)" d="
      M 720 330
      C 700 250 780 200 850 220
      C 880 150 980 150 1010 215
      C 1090 195 1150 250 1120 320
      C 1170 350 1160 440 1090 450
      C 1080 520 980 540 930 495
      C 880 545 780 535 770 470
      C 700 470 690 380 720 330 Z"/>
  </g>
  <!-- dashed murk outline -->
  <path fill="none" stroke="#3f4a22" stroke-width="3" stroke-dasharray="10 9" opacity="0.55" filter="url(#murk)" d="
      M 720 330
      C 700 250 780 200 850 220
      C 880 150 980 150 1010 215
      C 1090 195 1150 250 1120 320
      C 1170 350 1160 440 1090 450
      C 1080 520 980 540 930 495
      C 880 545 780 535 770 470
      C 700 470 690 380 720 330 Z"/>

  <!-- scattered messy filenames -->
  <g font-size="16" fill="#3a4020">
    <g transform="translate(900,255) rotate(-7)" filter="url(#soft)">
      <rect x="-8" y="-19" rx="4" width="150" height="28" fill="#eef0dd" opacity="0.92"/>
      <text>events_final.csv</text></g>
    <g transform="translate(820,320) rotate(6)" filter="url(#soft)">
      <rect x="-8" y="-19" rx="4" width="182" height="28" fill="#eef0dd" opacity="0.92"/>
      <text>events_final_REAL.csv</text></g>
    <g transform="translate(860,400) rotate(-4)" filter="url(#soft)">
      <rect x="-8" y="-19" rx="4" width="150" height="28" fill="#eef0dd" opacity="0.92"/>
      <text>events_1000.csv.bak</text></g>
    <g transform="translate(985,355) rotate(9)" filter="url(#soft)">
      <rect x="-8" y="-19" rx="4" width="152" height="28" fill="#eef0dd" opacity="0.92"/>
      <text>real_events.parquet</text></g>
  </g>
  <!-- question marks -->
  <g fill="#2f3818" font-weight="bold" opacity="0.75" font-style="italic">
    <text x="775" y="270" font-size="34">?</text>
    <text x="1075" y="330" font-size="40">?</text>
    <text x="790" y="440" font-size="30">?</text>
    <text x="960" y="470" font-size="36">?</text>
  </g>

  <!-- transition seam -->
  <rect x="560" y="60" width="120" height="524" fill="url(#transition)"/>

  <!-- patch stray filter bleed at canvas corners -->
  <g fill="url(#paper)">
    <rect x="-2" y="-2" width="90" height="56"/>
    <rect x="1110" y="-2" width="92" height="56"/>
    <rect x="-2" y="590" width="90" height="56"/>
    <rect x="1110" y="590" width="92" height="56"/>
  </g>

  <!-- ===================== TITLES ===================== -->
  <g text-anchor="middle">
    <text x="330" y="80" font-size="46" font-weight="bold" fill="#1c5c8c" font-style="italic">Data Lake</text>
    <text x="330" y="612" font-size="20" fill="#2c3e50" opacity="0.85">metadata denoting shape</text>

    <text x="915" y="80" font-size="46" font-weight="bold" fill="#4f5a28" font-style="italic">Data Swamp</text>
    <text x="915" y="612" font-size="20" fill="#3f4a22" opacity="0.85">no metadata = no shape</text>
  </g>

  <!-- center arrow: order -> chaos -->
  <g opacity="0.9">
    <text x="620" y="332" font-size="66" fill="#6b5f38" text-anchor="middle" font-weight="bold">→</text>
  </g>
</svg>
